---
layout: default
---

<article class="entry">
  <div class="container container--narrow">
    <header class="entry-header">
      <h1 class="entry-title">{{ page.title }}</h1>
      <p class="entry-date">{% if page.status %}{{ page.status }} · {% endif %}{{ page.date_added | date: "%B %Y" }}</p>
      {% if page.one_line %}
      <p class="entry-oneline">{{ page.one_line }}</p>
      {% endif %}
      {% if page.tags.size > 0 %}
      <div class="entry-tags">
        {% for tag in page.tags %}<span class="tag">{{ tag }}</span>{% endfor %}
      </div>
      {% endif %}
    </header>
    <div class="entry-body">
      {{ content }}
    </div>
  </div>
</article>
