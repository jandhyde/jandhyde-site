title: jhyde
description: "Projects I've built -- the problem, what I did, and what came out."
url: "https://jandhyde.github.io"
baseurl: "/jandhyde-site"

markdown: kramdown
kramdown:
  input: GFM
  auto_ids: true
  syntax_highlighter: none

permalink: /:slug/

collections:
  projects:
    output: true
    permalink: /projects/:slug/

defaults:
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "default"
  - scope:
      path: ""
      type: "projects"
    values:
      layout: "project"

plugins:
  - jekyll-seo-tag
